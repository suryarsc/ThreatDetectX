name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check backend tests datasets

      - name: Generate dataset and train model
        run: |
          python datasets/generate_synthetic_logs.py --rows 2000 --anomaly-rate 0.08
          python backend/detection_engine/train.py --data datasets/synthetic_logs.csv

      - name: Run tests
        run: pytest
